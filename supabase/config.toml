# Local development stack for fit-app: Postgres, Auth and Storage on Docker.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
#
# This file is trimmed on purpose. `supabase init` writes every default as a
# comment; what is left here is what we actually decided. Anything not listed
# keeps the CLI default, so upgrading the CLI does not silently freeze an old
# default into the repo.
#
# Production runs on two hosted Supabase projects (staging and production) in the
# Sao Paulo region, next to the API in AWS `sa-east-1`. See docs/adr/0002 and 0005.
project_id = "fit-app"

[api]
enabled = true
port = 54321
# Only `public` is exposed through the Data API (PostgREST). The domain schemas
# (identity, nutrition, health, insights) stay unreachable from outside the API,
# which is the rule in CLAUDE.md: clients talk to the API, never to the database.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
# Used by `supabase db diff` for the shadow database.
shadow_port = 54320
# Has to match the hosted projects.
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
# Loaded by `pnpm db:reset`. Synthetic data only, never real patient data.
sql_paths = ["./seed.sql"]

# Realtime is off: no client subscribes to the database (CLAUDE.md, rule 6).
[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Catches the e-mails Auth sends locally (confirmation, magic link, recovery).
# Nothing leaves the machine; read them at http://127.0.0.1:54324.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# The professional panel in development (apps/web).
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
# Off locally so a seeded account can sign in without opening the inbox. The
# hosted projects keep confirmation on.
enable_confirmations = false

[auth.sms]
enable_signup = false

# No edge functions: business logic lives in the NestJS API (CLAUDE.md).
[edge_runtime]
enabled = false

# Logflare/Vector are heavy and buy nothing locally; logs go to CloudWatch in
# production.
[analytics]
enabled = false
