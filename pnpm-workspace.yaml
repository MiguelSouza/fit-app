# apps/mobile is intentionally absent: it is a Flutter (Dart) app and is not a
# pnpm package. It is built with the Flutter toolchain, not with turbo.
packages:
  - apps/api
  - apps/web
  - packages/*
  - infra
  - scripts

# Install scripts are blocked by default; these are the ones that were read and
# allowed. Jest brings both: `@parcel/watcher` (watch mode) and `unrs-resolver`
# (module resolution). Neither compiles anything here — the watcher's script
# only builds from source when `npm_config_build_from_source` is set, and the
# resolver's only picks the prebuilt binary of the current platform. Without
# them jest falls back to polling and to a slower resolver.
allowBuilds:
  '@parcel/watcher': true
  unrs-resolver: true
  # drizzle-kit runs `drizzle.config.ts` and the schema files through esbuild;
  # the install script only downloads the prebuilt binary for this platform.
  # Without it drizzle-kit cannot read a TypeScript config at all.
  esbuild: true
  # `swagger-ui-dist`, which serves the `/docs` of the API outside production,
  # brings this one: its install script only reports the install to the vendor's
  # servers. We say no explicitly instead of leaving it undecided, because an
  # undecided script fails `pnpm install` in pnpm 12.
  '@scarf/scarf': false
  # The three below arrive with `@testcontainers/postgresql`, through
  # `dockerode`, and all three are refused: the Docker daemon is reached over a
  # named pipe or a local socket, never over SSH, and talking to it needs none
  # of what these scripts build. `ssh2` compiles an optional native addon
  # (`cpu-features`) that only speeds up an SSH handshake we never do, that
  # addon's own script is a `node-gyp rebuild` needing a C++ toolchain on every
  # machine, and `protobufjs`'s postinstall just prints a warning about the
  # version range of whoever depends on it.
  ssh2: false
  cpu-features: false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@next/env@16.4.1'
  - '@next/eslint-plugin-next@16.4.1'
  - '@next/swc-darwin-arm64@16.4.1'
  - '@next/swc-darwin-x64@16.4.1'
  - '@next/swc-linux-arm64-gnu@16.4.1'
  - '@next/swc-linux-arm64-musl@16.4.1'
  - '@next/swc-linux-x64-gnu@16.4.1'
  - '@next/swc-linux-x64-musl@16.4.1'
  - '@next/swc-win32-arm64-msvc@16.4.1'
  - '@next/swc-win32-x64-msvc@16.4.1'
  - lucide-react@1.57.0
  - next@16.4.1
  - react-dom@19.3.1
  - react@19.3.1
